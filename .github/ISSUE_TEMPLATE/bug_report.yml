name: Bug report
description: Report a reproducible Synapse library problem.
body:
    - type: markdown
      attributes:
          value: |
              For sensitive findings, follow SECURITY.md. Use synthetic examples and remove credentials, authentication links, private prompts and account data.
    - type: input
      id: package
      attributes:
          label: Package and version
          description: Include the affected @pixel-brewery/synapse-* package and installed version or source revision.
      validations:
          required: true
    - type: input
      id: environment
      attributes:
          label: Environment
          description: Operating system, Node.js version and relevant provider CLI name/version, or “no CLI involved”.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Minimal reproduction
          description: Include a small synthetic example and exact steps or commands. Avoid personal account state.
      validations:
          required: true
    - type: textarea
      id: behavior
      attributes:
          label: Expected and actual behavior
          description: Explain the observable difference, including any relevant cancellation, session, authentication or routing behavior.
      validations:
          required: true
    - type: textarea
      id: evidence
      attributes:
          label: Sanitized error and verification
          description: Include safe error codes/output and checks you ran. State which operating system actually reproduced the issue.
