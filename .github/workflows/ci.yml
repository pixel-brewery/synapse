name: Verify
on:
    pull_request:
    merge_group:
    workflow_dispatch:
    workflow_call:
permissions:
    contents: read
jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  package-manager-cache: false
            - run: corepack enable
            - run: yarn install --immutable
            - run: yarn verify
            - run: yarn packaging:verify
    quality-gate:
        name: Quality Gate
        needs: verify
        if: ${{ always() }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Require successful verification on every supported platform
              shell: bash
              env:
                  VERIFY_RESULT: ${{ needs.verify.result }}
              run: |
                  if [ "$VERIFY_RESULT" != success ]; then
                      echo 'All platform verification jobs must succeed.' >&2
                      exit 1
                  fi
