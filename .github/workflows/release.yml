name: Continuous Package Release

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            specifier:
                description: Semantic version increment for the next package release
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major

permissions:
    contents: read

concurrency:
    group: continuous-package-release
    cancel-in-progress: false

env:
    RELEASE_SPECIFIER: ${{ inputs.specifier || 'patch' }}

jobs:
    verify:
        name: Verify macOS, Linux, and Windows
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read

    release:
        name: Verify and publish the package family
        needs: verify
        if: github.ref == 'refs/heads/main'
        # Configure required reviewers and main-only deployment branches in repository settings.
        environment: release
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  # Repository write authority remains available to this trusted release job.
                  persist-credentials: true

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  package-manager-cache: false

            - run: corepack enable

            - name: Require package publishing credentials
              env:
                  PACKAGES_TOKEN_CONFIGURED: ${{ secrets.PACKAGES_TOKEN != '' }}
              run: |
                  set -euo pipefail
                  if [ "$PACKAGES_TOKEN_CONFIGURED" != 'true' ]; then
                      echo 'The PACKAGES_TOKEN secret is required to publish the package family.' >&2
                      exit 1
                  fi

            - name: Install dependencies
              run: yarn install --immutable

            - name: Require the current main revision
              run: |
                  set -euo pipefail
                  git fetch origin main --tags
                  if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
                      echo "main moved beyond ${GITHUB_SHA}; the newer workflow run owns the next release." >&2
                      exit 1
                  fi

            - name: Prepare the version, changelog, commit, and tag
              id: release
              run: |
                  set -euo pipefail
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                  if git tag --list 'v[0-9]*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                      yarn release:nx "$RELEASE_SPECIFIER"
                  else
                      # A history reset preserves manifest versions as the release baseline.
                      yarn release:nx "$RELEASE_SPECIFIER" --first-release
                  fi

                  version="$(node -p "require('./libs/synapse-core/package.json').version")"
                  tag="v${version}"
                  if [ "$(git rev-parse "${tag}^{commit}")" != "$(git rev-parse HEAD)" ]; then
                      echo "${tag} does not point at the generated release commit." >&2
                      exit 1
                  fi
                  echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
                  echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

            - name: Refuse an existing remote release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
                  if [ -n "$remote_tag" ]; then
                      echo "${RELEASE_TAG} already exists; retry release:publish from its prepared checkout without another version bump." >&2
                      exit 1
                  fi

                  release_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
                  if printf '%s\n' "$release_tags" | grep -Fxq "$RELEASE_TAG"; then
                      echo "The GitHub release ${RELEASE_TAG} already exists." >&2
                      exit 1
                  fi

            - name: Generate the versioned API documentation
              run: yarn docs

            - name: Format the generated changelog
              run: yarn prettier --write CHANGELOG.md

            - name: Verify the versioned release source
              run: yarn verify

            - name: Verify all ten packed consumers
              run: yarn packaging:verify

            - name: Include the verified documentation in the release commit
              run: |
                  set -euo pipefail
                  git add -- CHANGELOG.md .docs/api .docs/packages/*/api
                  if ! git diff --cached --quiet; then
                      git commit --amend --no-edit
                      git tag --force --annotate "$RELEASE_TAG" --message "$RELEASE_TAG"
                  fi
                  if [ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
                      echo "${RELEASE_TAG} does not point at the verified release commit." >&2
                      exit 1
                  fi
                  if [ -n "$(git status --porcelain)" ]; then
                      echo 'The release checks left changes outside the generated changelog and API documentation.' >&2
                      git status --short
                      exit 1
                  fi

            # Checkout retains github.token for this push. A release commit pushed
            # with that token does not recursively start another release workflow.
            - name: Publish the verified release commit and tag atomically
              run: |
                  set -euo pipefail
                  git fetch origin main --tags
                  if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
                      echo "main moved beyond ${GITHUB_SHA}; the newer workflow run owns the next release." >&2
                      exit 1
                  fi
                  remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
                  if [ -n "$remote_tag" ]; then
                      echo "${RELEASE_TAG} appeared while the release was being verified." >&2
                      exit 1
                  fi
                  git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${RELEASE_TAG}"

            # The tag is durable before any registry write. A partial upload can be
            # retried with release:publish at that tag; Nx skips existing versions.
            - name: Publish the ten prepared package manifests
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
              run: yarn release:publish

            - name: Download every published package from GitHub Packages
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
              run: |
                  set -euo pipefail
                  manifests=(libs/*/package.json tools/mcp/package.json)
                  if [ "${#manifests[@]}" -ne 10 ]; then
                      echo 'The release must contain exactly nine runtime libraries and the MCP package.' >&2
                      exit 1
                  fi
                  package_dir="$RUNNER_TEMP/synapse-published-packages"
                  mkdir -p "$package_dir"

                  for manifest in "${manifests[@]}"; do
                      package_name="$(node -p "require('./${manifest}').name")"
                      package_version="$(node -p "require('./${manifest}').version")"
                      if [ "$package_version" != "$RELEASE_VERSION" ]; then
                          echo "${package_name} has version ${package_version}, expected ${RELEASE_VERSION}." >&2
                          exit 1
                      fi

                      downloaded=false
                      for attempt in 1 2 3; do
                          if npm pack "${package_name}@${package_version}" \
                              --registry=https://npm.pkg.github.com \
                              --pack-destination="$package_dir"; then
                              downloaded=true
                              break
                          fi
                          if [ "$attempt" -lt 3 ]; then
                              sleep "$((attempt * 5))"
                          fi
                      done
                      if [ "$downloaded" != true ]; then
                          echo "Could not download ${package_name}@${package_version} after three attempts." >&2
                          exit 1
                      fi
                  done

            # GitHub creates new packages as private. Their owner must enable
            # public visibility, then run release:verify for the complete family.
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  gh release create "$RELEASE_TAG" \
                      --repo "$GITHUB_REPOSITORY" \
                      --verify-tag \
                      --title "Synapse ${RELEASE_VERSION}" \
                      --generate-notes
