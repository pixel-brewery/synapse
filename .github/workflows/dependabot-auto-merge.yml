name: Merge verified Dependabot updates

on:
    workflow_run:
        workflows: [Verify]
        types: [completed]

permissions: {}

jobs:
    merge:
        if: >-
            ${{ github.repository == 'pixel-brewery/synapse' &&
                github.event.workflow_run.event == 'pull_request' &&
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.head_repository.full_name == github.repository }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        concurrency:
            group: dependabot-merge-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
            cancel-in-progress: false
        permissions:
            actions: write
            contents: write
            pull-requests: read
        steps:
            # Execute only the trusted default-branch helper, never PR code or artifacts.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  package-manager-cache: false

            - name: Merge the unchanged Dependabot PR after every verification job succeeds
              id: merge
              env:
                  GH_TOKEN: ${{ github.token }}
                  WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
                  WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
              run: node tools/mergeDependabotPullRequest.mjs

            # GITHUB_TOKEN merges do not trigger the usual push workflows.
            - name: Request the next package release
              if: steps.merge.outputs.merged == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f specifier=patch

            - name: Refresh the remaining Dependabot PRs
              if: always() && steps.merge.outputs.merged == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run rebase-dependabot.yml --repo "$GITHUB_REPOSITORY" --ref main
