# Green Dependabot pull requests merge automatically: .github/workflows/dependabot-merge.yml
version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      rebase-strategy: 'auto'
      schedule:
          interval: 'weekly'
          day: 'monday'
      open-pull-requests-limit: 10
      commit-message:
          prefix: 'chore(deps)'
          prefix-development: 'chore(deps-dev)'
      groups:
          nx:
              patterns:
                  - '@nx/*'
                  - 'nx'
          testing:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
      ignore:
          # TypeScript 7 (native compiler) lacks the JS API our toolchain uses; revisit when it supports TS 7.
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']

    - package-ecosystem: 'github-actions'
      directory: '/'
      rebase-strategy: 'auto'
      schedule:
          interval: 'weekly'
          day: 'monday'
      open-pull-requests-limit: 5
      commit-message:
          prefix: 'chore(ci)'
      groups:
          github-actions-updates:
              patterns:
                  - '*'
